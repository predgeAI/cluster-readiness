[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "predge-cluster-readiness"
version = "0.1.0"
description = "GPU cluster readiness scan against published ClusterMAX criteria, plus GPU node health checks with automatic drain. Runs locally; sends nothing."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Predge"}]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Clustering",
]

[project.optional-dependencies]
crypto = ["cryptography>=41"]

[project.scripts]
predge-ready = "predge_ready.cli:main"

[project.urls]
Homepage = "https://github.com/predgeAI/cluster-readiness"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
predge_ready = ["data/*.json", "fixtures/**/*", "fixtures/*/*/*", "fixtures/*/*/*/*", "fixtures/*/*/*/*/*", "fixtures/*/*/*/*/*/*"]
